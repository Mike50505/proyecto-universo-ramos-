{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>{% if editing %}Editar usuario{% else %}Nuevo usuario{% endif %}</h1></div><form method="post" class="form-panel narrow">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</div>{% endfor %}<button class="button primary">Guardar usuario</button></form>{% endblock %}
